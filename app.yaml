# Google App Engine flexible/standard Node.js config
runtime: nodejs20
env: standard
instance_class: F2

env_variables:
  NODE_ENV: "production"
  # Set ANTHROPIC_API_KEY, FIREBASE_PROJECT_ID via Secret Manager / gcloud env
  # ANTHROPIC_API_KEY: "..."
  # FIREBASE_PROJECT_ID: "..."

handlers:
  - url: /.*
    script: auto
    secure: always
